# PR마다 기본 검사(claude/변경_관리_원칙.md): 코드가 읽히는지, 손으로 넣는 자료 파일 형식·KBO 합계가 맞는지.
# 판정 회귀 시험(tests/regression.py)은 자료 DB가 있어야 해서 PR 전에 따로 돌린다.
name: 기본 검사

on:
  pull_request:
    branches: ['main']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 코드 문법
        run: python -m compileall -q server pipeline tests
      - name: 손으로 넣는 자료 파일
        run: python pipeline/check_manual_data.py
      - name: 동시 요청 DB 창구
        run: python tests/thread_db.py
      - name: 서비스 패키지 설치
        run: pip install -r requirements.txt
      - name: 날짜별 방문자 지역 코드 중복 시험
        run: python tests/test_datalab_codes.py
      - name: 응답 길이 제한 장치 시험
        run: python tests/test_size_guard.py
      - name: 범위 밖 입력 안내 시험
        run: python tests/test_input_guard.py
      - name: 최신 주차 캐시 시험
        run: python tests/test_latest_week.py
      - name: KOSIS 표 메모리 시험
        run: python tests/test_kosis_memory.py
      - name: 이동 표 메모리 시험
        run: python tests/test_moves_memory.py
      - name: 미공표 지역 생활인구 공식 시험(0.6.5)
        run: python tests/test_lifepop_065.py
      - name: 생활인구 여러 달 한 번에 시험(0.6.6)
        run: python tests/test_lifepop_range.py
      - name: 생활인구 공표일(보도계획) 시험
        run: python tests/test_release_plan.py
      - name: 전통시장 장날 자료(API) 시험
        run: python tests/test_markets.py
      - name: 받는 중 표시(두 서버 동시 받기 막기) 시험
        run: python tests/test_update_lock.py
      - name: KOPIS afterdate 받기 시험(가짜 KOPIS로 며칠 밤)
        run: python tests/test_kopis_afterdate.py
